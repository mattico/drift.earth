# Type-checks, smoke-tests the physics and builds on every push and pull
# request, and runs the game's scenarios in headless Chrome alongside. Pushes
# to the default branch (main) also deploy dist/ to GitHub Pages (Settings >
# Pages > Source: GitHub Actions), with the MAPS_API_KEY Actions secret built
# in if set.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A newer commit on the same PR supersedes the old run; branch pushes queue
    # so a deploy is never cut off halfway through its build.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      # configure-pages reads the Pages site's URL and base path.
      pages: read
    env:
      DEPLOY: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    outputs:
      deploy: ${{ env.DEPLOY }}
    steps:
      - uses: actions/checkout@v7

      # No version: it installs the one pinned by packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Runs the car physics headless through scripted inputs (no browser or
      # tiles); fails if the simulation throws.
      - run: pnpm handling

      # Each surface against asphalt, for both cars: fails if a tuning target
      # is missed (TARGETS in tools/handling.mjs).
      - run: pnpm handling --surfaces --check

      - id: pages
        if: env.DEPLOY == 'true'
        uses: actions/configure-pages@v6

      # The site is served from /<repo>/, or / on a custom domain (where
      # configure-pages gives an empty base_path, which must survive: an
      # expression's || would replace it). PR builds use the project-site path
      # so sub-path breakage shows up before merge.
      #
      # Vite inlines MAPS_ and VITE_ variables into the bundle. A deploy ships
      # the MAPS_API_KEY secret: a key restricted by HTTP referrer to the Pages
      # origin, so visitors can drive without one of their own. Other builds
      # (PRs, branches) get no key.
      - name: Build
        run: |
          if [ "$DEPLOY" = true ]; then export BASE_PATH="$PAGES_BASE"; else export BASE_PATH="/$REPO"; fi
          pnpm exec vite build
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          REPO: ${{ github.event.repository.name }}
          # The site's address, for the link-preview tags (absolute URLs).
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          MAPS_API_KEY: ${{ env.DEPLOY == 'true' && secrets.MAPS_API_KEY || '' }}
          VITE_GOOGLE_MAPS_KEY: ''

      # Any other key-shaped string (one leaked from somewhere else) fails it.
      - name: Check dist/ for API keys
        run: pnpm check:key
        env:
          ALLOWED_KEY: ${{ env.DEPLOY == 'true' && secrets.MAPS_API_KEY || '' }}

      - if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Drives the real game in headless Chrome through the practice-track
  # scenarios (tools/scenarios.mjs; no key or network). A job of its own: a
  # flaky browser must never hold up the build or the deploy. The runner has
  # Google Chrome but no GPU, so WebGL runs on SwiftShader (tools/browser.mjs).
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: scenarios-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A step timeout, well inside the job's: a hung page then fails the step
      # (a job timeout would cancel it, and skip the upload below). The JSON
      # keeps the timings and the runner's renderer and fps; progress lines
      # still go to the log.
      - name: Scenarios
        timeout-minutes: 8
        run: |
          mkdir -p traces/scenarios
          node tools/scenarios.mjs --keep-going --json > traces/scenarios/results.json

      # Pass or fail: results.json, and for each failure a screenshot, the
      # page console and the trace (load.* if the page never started).
      - if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: scenarios
          path: traces/scenarios/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One deploy at a time, and never cancel one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
